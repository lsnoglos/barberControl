name: BarberControl CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxis y separación de proyectos
        run: node tests/validate.js
