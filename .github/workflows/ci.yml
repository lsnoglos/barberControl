name: BarberControl CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxis y separación de proyectos
        run: node tests/validate.js
      - name: Probar catálogos, videos y privacidad
        run: node tests/catalogos.test.js
      - name: Probar caché, fechas y aviso de reserva
        run: node tests/booking-ux.test.js
      - name: Probar escaparate, WhatsApp, estilos y calendario
        run: node tests/escaparate.test.js

      - name: Probar paquete de conexión Admin → Public
        run: node tests/connection.test.js
