<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BarberControl | Administración</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #101215; color: #f7f7f7; display: grid; place-items: center; }
    main { width: min(92vw, 650px); padding: 40px 30px; border: 1px solid #34373c; border-radius: 22px; background: #1b1e23; }
    .eyebrow { color: #d8b875; letter-spacing: .15em; font-size: 12px; font-weight: 700; text-transform: uppercase; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); margin: .5rem 0; }
    p { line-height: 1.6; color: #c5c7cb; }
    .note { display: inline-block; padding: 8px 12px; background: #34312a; border-radius: 8px; color: #f0d39d; margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Acceso reservado al propietario</div>
    <h1>Panel de BarberControl</h1>
    <p>Desde este panel administrarás los servicios, sus precios, la galería, el horario laboral y las citas de tu barbería.</p>
    <p>Esta pantalla es un esqueleto. Aún no permite gestionar información ni ejecutar el instalador automático.</p>
    <div class="note" id="estado">Cargando estado…</div>
  </main>
  <script>
    google.script.run
      .withSuccessHandler(function(resultado) {
        document.getElementById('estado').textContent = resultado.mensaje;
      })
      .withFailureHandler(function() {
        document.getElementById('estado').textContent = 'No se pudo consultar el estado.';
      })
      .obtenerEstadoAdmin();
  </script>
</body>
</html>
